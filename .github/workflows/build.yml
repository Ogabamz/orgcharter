name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleLiteRelease
          mkdir -p out
          cp app/build/outputs/apk/lite/release/app-lite-release.apk out/QuietLauncher-${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuietLauncher-${{ github.run_number }}
          path: out/*.apk

      - name: Publish release (easy download from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Quiet Launcher build ${{ github.run_number }} (lite)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Lite edition: no accessibility service, so Play Protect shouldn't block it.
            (No pause screen or website blocking. Build 4 is the full edition.)

            Download the .apk below on your phone and open it to install.
            Built from `${{ github.ref_name }}` at ${{ github.sha }}.
          files: out/*.apk
